name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      # Version comes from .nvmrc.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck apps/public
        run: pnpm --filter @e-glasul/public check

      - name: Typecheck apps/app
        run: pnpm --filter @e-glasul/app typecheck

      - name: Build both apps
        run: pnpm --recursive build
